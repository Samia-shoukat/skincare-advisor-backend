[pytest]
# Without this every async test needs its own @pytest.mark.asyncio decorator,
# and a test that is missing one is silently skipped rather than failing --
# which is the worst possible failure mode for a safety test suite.
asyncio_mode = auto

testpaths = tests
python_files = test_*.py
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning